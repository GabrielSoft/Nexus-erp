services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://nexus:nexus@postgres:5432/nexus?schema=public"
      FRONTEND_URL: "http://localhost:5173"
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
      PORT: "3333"
      RUN_SEED: "true"
      ADMIN_EMAIL: "admin@nexuserp.com"
      ADMIN_PASSWORD: "Nexus@123"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3333:3333"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
